[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "checkout-anomaly"
version = "0.1.0"
description = "Unsupervised anomaly detection on self-checkout scan sequences, demonstrated on synthetic data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
keras = ["tensorflow>=2.15"]

[project.scripts]
checkout-anomaly = "checkout_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
